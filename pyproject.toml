[project]

name = "expense-tracker"
version = "0.1.0"
description = "Personal expense tracker for importing and analyzing financial transactions"
requires-python = ">=3.12"
dependencies = ["pydantic", "pydantic-settings"]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pre-commit", "mypy", "import-linter"]

[project.scripts]
expense-tracker = "expense_tracker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
warn_unused_ignores = true

[tool.importlinter]
root_package = "expense_tracker"

[[tool.importlinter.contracts]]
name = "Domain is independent"
type = "forbidden"
source_modules = ["expense_tracker.domain"]
forbidden_modules = [
    "expense_tracker.services",
    "expense_tracker.sources",
    "expense_tracker.cli",
]

[[tool.importlinter.contracts]]
name = "Services do not know adapters"
type = "forbidden"
source_modules = ["expense_tracker.services"]
forbidden_modules = [
    "expense_tracker.sources",
    "expense_tracker.cli",
]
