[project]
name = "expense-tracker"
version = "0.1.0"
description = "Personal expense tracker for importing and analyzing financial transactions"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "pytest", "pre-commit"]

[project.scripts]
expense-tracker = "expense_tracker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"